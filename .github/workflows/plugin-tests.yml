name: Plugin phpunit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      monorepo_ref:
        description: 'ojs-plugins-monorepo ref/SHA to test against (default: main)'
        required: false
        default: main

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout post45-ojs (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout ojs-plugins-monorepo
        uses: actions/checkout@v4
        with:
          repository: Post45-Journal/ojs-plugins-monorepo
          token: ${{ secrets.MONOREPO_READ_TOKEN }}
          path: .monorepo
          ref: ${{ inputs.monorepo_ref || 'main' }}

      - name: Symlink post45Editorial into plugins/generic/
        run: ln -s "$PWD/.monorepo/plugins/post45Editorial" plugins/generic/post45Editorial

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, dom, curl, intl, zip, gd
          coverage: none

      - name: Copy OJS config template
        run: cp config.TEMPLATE.inc.php config.inc.php

      - name: Install pkp-lib dev dependencies (phpunit)
        working-directory: lib/pkp
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run post45 plugin tests (unit + mockable tiers)
        # --no-coverage: phpunit.xml declares a <coverage> section, and
        # PHPUnit 11 exits nonzero on the "No coverage driver available"
        # warning when neither pcov nor xdebug is installed. Skip the
        # coverage check entirely; we don't want coverage reports on every
        # push anyway.
        #
        # --exclude-group integration: integration tests require a MySQL
        # service + a seeded ojs_test schema + a config swap; that CI
        # scaffolding isn't wired up yet. Skipped here; run locally via
        # tools/dev/run-integration-tests.sh. When the CI DB service lands,
        # add a second step that runs `--group integration` in its own
        # PHPUnit process (running together in one process leaks plugin
        # locale state and false-fails the pure-unit tier).
        run: |
          php lib/pkp/lib/vendor/phpunit/phpunit/phpunit \
            --configuration lib/pkp/tests/phpunit.xml \
            --no-coverage \
            --exclude-group integration \
            plugins/generic/post45Editorial/tests
